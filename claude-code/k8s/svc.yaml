apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: dating
spec:
  selector:
    app: frontend
  ports:
    - name: http-front-v1   # Istio-friendly name
      port: 80  #svc listening on 
      targetPort: 8000   # 80 or "http-front-v2" if you prefer named port  matches the named port in Deployment
