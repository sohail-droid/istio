# // kind: VirtualService
# // metadata:
# //   name: dating-virtualservice
# //   namespace: dating
# // spec:
# //   hosts:
# //   - "dating.local"        # Listens for outside traffic requesting this domain
# //   - "comrade-daybreak-rentable.ngrok-free.dev"
# //   gateways:
# //   - dating-gateway        # Hooks into your Istio Ingress Gateway
# //   http:
# //   - route:
# //     - destination:
# //         host: frontend-service.dating.svc.cluster.local
# //         subset: my-subset-v1        # Points to the subset defined in your DestinationRule
# //         port:
# //           number: 80
# //       weight: 90          # 90% of external traffic
# //     - destination:
# //         host: frontend-service.dating.svc.cluster.local
# //         subset: my-subset-v2
# //         port:
# //           number: 80
# //       weight: 10          # 10% of external traffic


# ******************************************************************************
# * NEW TOPIC: 1. Header-Based Routing (A/B Testing)
# * Instead of a random percentage, this configuration sends standard users
# * to v1, but routes anyone with a specific HTTP header (user: beta-tester) to v2.
# ******************************************************************************

# apiVersion: networking.istio.io/v1
# kind: VirtualService
# metadata:
#   name: dating-virtualservice
#   namespace: dating
# spec:
#   hosts:
#   - "dating.local"
#   - "comrade-daybreak-rentable.ngrok-free.dev"
#   gateways:
#   - dating-gateway
#   http:
#   # * Rule 1: If the header 'user' exactly matches 'beta-tester', send to v2
#   - match:
#     - headers:
#         user:
#           exact: beta-tester
#     route:
#     - destination:
#         host: frontend-service.dating.svc.cluster.local
#         subset: my-subset-v2
#   # * Rule 2: Default fallback for everyone else, send to v1
#   - route:
#     - destination:
#         host: frontend-service.dating.svc.cluster.local
#         subset: my-subset-v1





# ******************************************************************************
# * NEW TOPIC: 2. Traffic Mirroring (also known as Shadowing) 
# * is one of the most powerful features in Istio. It allows you to send 100% of live user traffic 
# * to your stable v1 application, while secretly duplicating that exact same traffic 
# * to v2 in the background.
# *  Sends all traffic to v1, but duplicates requests to v2 silently (users only see v1 responses).
# ******************************************************************************

apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: dating-virtualservice
  namespace: dating
spec:
  hosts:
  - "dating.local"
  gateways:
  - dating-gateway
  http:
  - route:
    - destination:
        host: frontend-service.dating.svc.cluster.local
        subset: my-subset-v1
      weight: 100
    mirror:
      host: frontend-service.dating.svc.cluster.local
      subset: my-subset-v2
    mirrorPercentage:
      value: 100.0

