apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: dating-virtualservice
  namespace: dating
spec:
  hosts:
  - "dating.local"        # Listens for outside traffic requesting this domain
  gateways:
  - dating-gateway        # Hooks into your Istio Ingress Gateway
  http:
  - route:
    - destination:
        host: frontend-service.dating.svc.cluster.local
        subset: v1        # Points to the subset defined in your DestinationRule
        port:
          number: 80
      weight: 90          # 90% of external traffic
    - destination:
        host: frontend-service.dating.svc.cluster.local
        subset: v2
        port:
          number: 80
      weight: 10          # 10% of external traffic


#1. weighted traffic splitting(can be used to test new features in production)
#2. canary releases
#3. blue/green deployments
#4. A/B testing
