apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-v2
  namespace: dating
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
      version: v2
  template:
    metadata:
      labels:
        app: frontend
        version: v2
    spec:
      containers:
        - name: frontend-v2
          image: imastha8/istio-frontend:v2
          imagePullPolicy: Always   # use Never only if you don’t want to pull from Docker Hub
          ports:
            - containerPort: 80
